apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init-colordb
  labels:
    app: mongodb
data:
  mongo-init.js: |
    const dbName = process.env.DB_NAME;
    const dbUser = process.env.DB_USER;
    const dbPassword = process.env.DB_PASSWORD;

    db = db.getSiblingDB(dbName);

    console.log(`Initialization: ${dbName}`);
    console.log(`Initialization: Creating user ${dbUser}`)

    db.createUser({
      user: dbUser,
      pwd: dbPassword,
      roles: [{
        role: 'readWrite', 
        db: dbName 
      }]
    });

    console.log(`Initialization: Successful`)
